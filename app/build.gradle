plugins { id 'com.android.application' }

android {
    namespace 'os.vortex.tv'
    compileSdk 33
    defaultConfig {
        applicationId 'os.vortex.tv'
        minSdk 25
        targetSdk 25
        versionCode 1
        versionName '0.1.0-dev'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes { release { minifyEnabled false } }
    lint {
        // This local Nougat firmware component is not distributed through Google Play.
        // API 25 is deliberate; keep every unrelated lint error enabled.
        disable 'ExpiredTargetSdkVersion'
    }
}
